name: Daily Research Radar

on:
  schedule:
    # GitHub 使用 UTC 时间：22:17 UTC = 北京时间第二天 06:17
    - cron: "17 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: academic-map-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --upgrade requests

      - name: Update research radar
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scripts/update_radar.py

      - name: Commit public radar history
        run: |
          git config user.name "academic-map-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json site/data/radar.json site/data/last_run.txt
          git diff --cached --quiet || git commit -m "chore: update daily research radar"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build

    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
